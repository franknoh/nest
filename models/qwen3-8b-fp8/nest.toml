[model]
name = "qwen3-8b-fp8"
title = "Qwen3 8B FP8"
summary = "Qwen3 8B with every decoder projection in FP8 E4M3, one scale per block of 128 by 128 weights: Qwen's own FP8 checkpoint. 60% of bf16's memory, faster decoding."
license = "Apache-2.0"
family = "qwen3"
tags = ["text-generation", "decoder-only", "grouped-query-attention", "qk-norm", "fp8"]

[links]
huggingface = "https://huggingface.co/Qwen/Qwen3-8B-FP8"
github = "https://github.com/QwenLM/Qwen3"
arxiv = "https://arxiv.org/abs/2505.09388"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Vocab = 151936
H = 4096
Heads = 32
KvHeads = 8
HeadDim = 128
Inner = 12288
Layers = 36
Batch = 1
MaxSeq = 40960
T = "bf16"

[check]
B = 1
S = 8

[weights]
repo = "Qwen/Qwen3-8B-FP8"
revision = "220b46e3b2180893580a4454f21f22d3ebb187d3"
files = [
    "model-00001-of-00002.safetensors",
    "model-00002-of-00002.safetensors",
]
bindings = "bindings.json"

# Planned with each backend on one H100 (`plan_for`, measured), against the
# generated source alone.
[[backends]]
name = "deepgemm"
package = "linnet-deepgemm (Linnet's examples/09-backends/deepgemm)"
entry = "prefill"
device = "H100"
inputs = "2,048 tokens, numerics fast"
before = 45.8
after = 35.1
unit = "ms"
