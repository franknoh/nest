[model]
name = "llama-3.1-8b-instruct-fp8"
title = "Llama 3.1 8B Instruct FP8"
summary = "Llama 3.1 8B Instruct with every decoder projection in FP8 E4M3, one scale per output row: RedHatAI's FP8-dynamic checkpoint. Half the weight memory of bf16, faster single-sequence decoding."
license = "llama3.1"
family = "llama"
tags = ["text-generation", "decoder-only", "grouped-query-attention", "chat", "fp8"]

[links]
huggingface = "https://huggingface.co/RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic"
github = "https://github.com/meta-llama/llama-models"
arxiv = "https://arxiv.org/abs/2407.21783"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Vocab = 128256
H = 4096
Heads = 32
KvHeads = 8
Inner = 14336
Layers = 32
Batch = 1
MaxSeq = 8192
T = "bf16"

[check]
B = 1
S = 8

[weights]
repo = "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic"
revision = "442e7f522277df12f53d63e8384087af31fbfc4b"
files = [
    "model-00001-of-00002.safetensors",
    "model-00002-of-00002.safetensors",
]
bindings = "bindings.json"
