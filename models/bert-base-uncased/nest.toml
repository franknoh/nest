[model]
name = "bert-base-uncased"
title = "BERT Base (uncased)"
summary = "Google's original BERT: 12 post-norm encoder layers of width 768, word/position/token-type embeddings, and the next-sentence-prediction pooler."
license = "Apache-2.0"
family = "bert"
tags = ["fill-mask", "text-encoder", "encoder-only"]

[links]
huggingface = "https://huggingface.co/google-bert/bert-base-uncased"
github = "https://github.com/google-research/bert"
arxiv = "https://arxiv.org/abs/1810.04805"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Vocab = 30522
MaxPositions = 512
TypeVocab = 2
D = 768
Heads = 12
Inner = 3072
Layers = 12
T = "f32"

[check]
B = 1
S = 8

[weights]
repo = "google-bert/bert-base-uncased"
files = ["model.safetensors"]
bindings = "bindings.json"
