[model]
name = "mistral-7b-instruct-v0.3"
title = "Mistral 7B Instruct v0.3"
summary = "A 7B-parameter Llama-architecture decoder with grouped-query attention, a 32768-token vocabulary and context, and an untied output head, instruction-tuned."
license = "Apache-2.0"
family = "llama"
tags = ["text-generation", "decoder-only", "grouped-query-attention", "chat"]

[links]
huggingface = "https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3"
github = "https://github.com/mistralai/mistral-inference"
arxiv = "https://arxiv.org/abs/2310.06825"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Vocab = 32768
H = 4096
Heads = 32
KvHeads = 8
Inner = 14336
Layers = 32
Batch = 1
MaxSeq = 32768
T = "bf16"

[check]
B = 1
S = 8

[weights]
repo = "mistralai/Mistral-7B-Instruct-v0.3"
files = [
    "model-00001-of-00003.safetensors",
    "model-00002-of-00003.safetensors",
    "model-00003-of-00003.safetensors",
]
bindings = "bindings.json"
