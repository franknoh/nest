[model]
name = "sd-vae-ft-mse"
title = "SD VAE ft-MSE (decoder)"
summary = "Stability AI's MSE-finetuned autoencoder for Stable Diffusion, decoder half: group-normalized residual blocks, one spatial self-attention, and nearest-neighbour upsampling turn a 4-channel latent into an RGB image."
license = "MIT"
family = "sd-vae"
tags = ["image-generation", "vision", "convolutional", "diffusion", "autoencoder"]

[links]
huggingface = "https://huggingface.co/stabilityai/sd-vae-ft-mse"
github = "https://github.com/CompVis/stable-diffusion"
arxiv = "https://arxiv.org/abs/2112.10752"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "decode"

[generics]
H = 16
W = 16
T = "f32"

[check]
B = 1

[weights]
repo = "stabilityai/sd-vae-ft-mse"
files = ["diffusion_pytorch_model.safetensors"]
bindings = "bindings.json"
