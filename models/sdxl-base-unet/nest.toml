[model]
name = "sdxl-base-unet"
title = "SDXL Base UNet"
summary = "The 2.6B-parameter denoising UNet of Stable Diffusion XL base: residual blocks and spatial transformers at three resolutions, cross-attending to a 2048-wide text embedding, conditioned on the timestep and on SDXL's pooled-text-plus-micro-conditioning vector."
license = "CreativeML Open RAIL++-M"
family = "sdxl"
tags = ["image-generation", "vision", "convolutional", "diffusion", "text-to-image", "unet"]

[links]
huggingface = "https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0"
github = "https://github.com/Stability-AI/generative-models"
arxiv = "https://arxiv.org/abs/2307.01952"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
MidH = 8
MidW = 8
Depth1 = 2
Depth2 = 10
T = "f32"

[check]
B = 1
S = 77

[weights]
repo = "stabilityai/stable-diffusion-xl-base-1.0"
files = ["unet/diffusion_pytorch_model.safetensors"]
bindings = "bindings.json"
