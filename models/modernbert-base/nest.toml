[model]
name = "modernbert-base"
title = "ModernBERT-base"
summary = "Answer.AI's 2024 redesign of the BERT encoder: 22 pre-norm layers of width 768, rotary positions, GeGLU, no biases, and a sliding attention window that opens up every third layer."
license = "Apache-2.0"
family = "modernbert"
tags = ["fill-mask", "feature-extraction", "encoder-only", "rotary-embeddings", "sliding-window-attention"]

[links]
huggingface = "https://huggingface.co/answerdotai/ModernBERT-base"
github = "https://github.com/AnswerDotAI/ModernBERT"
arxiv = "https://arxiv.org/abs/2412.13663"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Vocab = 50368
D = 768
Heads = 12
Inner = 1152
Layers = 22
Window = 128
Period = 3
T = "f32"

[check]
B = 1
S = 256

[weights]
repo = "answerdotai/ModernBERT-base"
files = ["model.safetensors"]
bindings = "bindings.json"
