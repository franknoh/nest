[model]
name = "resnet-18"
title = "ResNet-18"
summary = "The 18-layer residual network for ImageNet-1k: a 7x7 stem, four stages of two residual blocks, and a linear classifier."
license = "Apache-2.0"
family = "resnet"
tags = ["image-classification", "vision", "convolutional"]

[links]
huggingface = "https://huggingface.co/microsoft/resnet-18"
github = "https://github.com/KaimingHe/deep-residual-networks"
arxiv = "https://arxiv.org/abs/1512.03385"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Height = 224
Width = 224
Classes = 1000
T = "f32"

[check]
B = 1

[weights]
repo = "microsoft/resnet-18"
files = ["model.safetensors"]
bindings = "bindings.json"
