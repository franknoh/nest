[model]
name = "llama-3.1-8b-instruct-w8a8"
title = "Llama 3.1 8B Instruct W8A8"
summary = "Llama 3.1 8B Instruct with every decoder projection in int8, one scale per output row, and prompts multiplied in int8 too: RedHatAI's W8A8 checkpoint. 60% of bf16's memory, faster decoding."
license = "llama3.1"
family = "llama"
tags = ["text-generation", "decoder-only", "grouped-query-attention", "chat", "int8"]

[links]
huggingface = "https://huggingface.co/RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8"
github = "https://github.com/meta-llama/llama-models"
arxiv = "https://arxiv.org/abs/2407.21783"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Vocab = 128256
H = 4096
Heads = 32
KvHeads = 8
Inner = 14336
Layers = 32
Batch = 1
MaxSeq = 8192
T = "bf16"

[check]
B = 1
S = 8

[weights]
repo = "RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8"
revision = "024e24cbe4153670f747383ea3265d0fb197c727"
files = [
    "model-00001-of-00002.safetensors",
    "model-00002-of-00002.safetensors",
]
bindings = "bindings.json"
