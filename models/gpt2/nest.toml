[model]
name = "gpt2"
title = "GPT-2 (124M)"
summary = "OpenAI's 124M-parameter GPT-2: learned positions, pre-norm blocks, a fused QKV projection, and a head tied to the token embedding."
license = "MIT"
family = "gpt2"
tags = ["text-generation", "decoder-only"]

[links]
huggingface = "https://huggingface.co/openai-community/gpt2"
github = "https://github.com/openai/gpt-2"
homepage = "https://openai.com/research/better-language-models"

[source]
path = "gpt2.linnet"
root = "Model"
entry = "forward"

[generics]
Vocab = 50257
MaxPositions = 1024
H = 768
Heads = 12
Layers = 12
Batch = 1
MaxSeq = 1024
T = "f32"

[check]
B = 1
S = 8

[weights]
repo = "openai-community/gpt2"
files = ["model.safetensors"]
bindings = "bindings.json"
