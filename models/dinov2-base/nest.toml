[model]
name = "dinov2-base"
title = "DINOv2-Base"
summary = "Meta's self-supervised Vision Transformer: 14-pixel patches of a 518-pixel image, 12 layers of width 768 with LayerScale, trained without labels for retrieval, segmentation and depth features."
license = "Apache-2.0"
family = "dinov2"
tags = ["image-feature-extraction", "vision", "encoder-only", "self-supervised"]

[links]
huggingface = "https://huggingface.co/facebook/dinov2-base"
github = "https://github.com/facebookresearch/dinov2"
arxiv = "https://arxiv.org/abs/2304.07193"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "forward"

[generics]
Height = 518
Width = 518
Channels = 3
Patch = 14
D = 768
Heads = 12
Inner = 3072
Layers = 12
T = "f32"

[check]
B = 1

[weights]
repo = "facebook/dinov2-base"
files = ["model.safetensors"]
bindings = "bindings.json"
