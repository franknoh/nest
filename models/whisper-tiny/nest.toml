[model]
name = "whisper-tiny"
title = "Whisper tiny"
summary = "OpenAI's smallest multilingual speech recognition model: a convolutional stem over a log-mel spectrogram, four encoder layers, and a four-layer decoder that cross-attends to them."
license = "Apache-2.0"
family = "whisper"
tags = ["automatic-speech-recognition", "audio", "encoder-decoder", "cross-attention", "multilingual"]

[links]
huggingface = "https://huggingface.co/openai/whisper-tiny"
github = "https://github.com/openai/whisper"
arxiv = "https://arxiv.org/abs/2212.04356"

[source]
path = "src/lib.linnet"
root = "Model"
entry = "encode"

[generics]
Mels = 80
Frames = 3000
D = 384
Heads = 6
Inner = 1536
EncoderLayers = 4
DecoderLayers = 4
Vocab = 51865
MaxTokens = 448
T = "f32"

[check]
B = 1

[weights]
repo = "openai/whisper-tiny"
files = ["model.safetensors"]
bindings = "bindings.json"
